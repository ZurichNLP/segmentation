# Template. Copy to paths.local.yaml, set output_dir, and fill in the data
# keys you need.
#
# paths.local.yaml is not committed. When it exists it is the only file read:
# it is never merged with paths.uzh.yaml. A key you leave empty stops only
# the code that uses it, with an error that names the key.
#
# Two variables exist: ${user}, the name of the account that runs the code
# (what SLURM writes for %u, whatever $USER says), and ${output_dir}. Any
# other `$` is an error: a value cannot name an environment variable.
# Every location is an absolute path. `python -m paths` shows the result.

# Folder for everything the code writes. A checkpoint is about 68 MB and each
# run keeps two, so use a disk with room.
output_dir:

# To move one output, change its line.
outputs:
  # Files that are rebuilt from the data when missing: YouTube-SL-25 pose
  # headers, subtitle cues and alignment measures, and class weights. The
  # first build reads every pose header of the corpus, which takes from
  # minutes to an hour. Delete this folder if you change a data location.
  cache: ${output_dir}/cache
  # One folder per training run: checkpoints, run_config.json, the data
  # report, figures. experiments/train.py links `dist` to it.
  dist: ${output_dir}/dist
  # Run files of Weights & Biases, which makes its own `wandb` folder inside.
  wandb: ${output_dir}/wandb
  # SLURM logs. SLURM itself takes the folder from the #SBATCH --output line
  # of experiments/pretrain_youtube.slurm, so keep the two the same.
  slurm: ${output_dir}/slurm

data:
  public_dgs_corpus:
    # TensorFlow Datasets folder that contains the `dgs_corpus` build with
    # holistic poses at 25 fps. Needed for the 2023 model and `--source tfds`.
    tfds:
    # The download archive of that build: the .pose, .eaf and .cmdi files,
    # each beside an .INFO file that holds its `original_fname`. Needed for
    # everything else that reads the Public DGS Corpus.
    downloads:
  youtube_sl25:
    # Must contain mediapipe/<video id>.pose, subtitles/<video id>.*.vtt and
    # youtube-sl-25_youtube-sl-25-metadata.csv.
    root:
    # Optional, used only for the keyframes in figures. Must contain
    # ase/downloads/<video id>/<video id>.mp4 and the same under non-ase/.
    # Left empty, or set to a folder that cannot be reached, figures draw the
    # pose instead.
    videos:
  ncslgr:
    # Where datasets/ncslgr/download.py puts the archives. Created if
    # missing. The licence forbids redistribution: keep it private.
    # datasets/ncslgr/explore.py reads what the script extracts and
    # downloads there: videos/, video_index-20120129/ and
    # signstream-xmlparser/.
    root:
  signsuisse:
    # Must contain example_mediapipe/<id>.pose, example_videos/<id>.mp4,
    # metadata_test_de_dsgs.csv and metadata_test_dsgs_de.csv.
    # datasets/signsuisse/run_2023_segmentation.py writes its ELAN files
    # beside example_mediapipe, into example_segmentation/v2023_<tag>_<b>_<o>/,
    # named after the model and the sign thresholds: with its default
    # arguments, example_segmentation/v2023_e4s_60_50/.
    # datasets/signsuisse/explore.py reads the ELAN files of that folder, and
    # also needs example_openpose/ and no_example_ids.txt.
    root:
  bsl_corpus:
    # Must contain info.pkl, the BSLCORPUS index of Renz et al. (2021).
    # When the file is missing, datasets/bsl_corpus/explore.py writes it
    # there from the branch `bsl` of this repository. It reads the local
    # branch, which a new clone does not have: `git branch bsl origin/bsl`
    # makes it. Closed-access material: keep the folder private.
    root:
  how2sign:
    # The main copy. Must contain video_level/ with raw_videos, mediapipe,
    # subtitles_manual, subtitles_auto, subtitles_audio and segmentation,
    # and sentence_level/{train,val,test}/rgb_front/eaf_files. Read only by
    # datasets/how2sign/explore.py, which counts the files.
    root:
    # The pose cache of the parsign project: {train,val,test}/*.npz. It
    # belongs to another project: read it, do not change it.
    parsign_cache:
  mediapi_skel:
    # TensorFlow Datasets folder that contains the `mediapi_skel` build, as
    # `tfds` of public_dgs_corpus contains `dgs_corpus`. Read only by
    # datasets/mediapi_skel/explore.py, which needs dataset_info.json and
    # features.json of the build, not its records.
    tfds:
